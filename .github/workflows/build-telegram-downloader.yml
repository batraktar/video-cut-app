name: Build Telegram Downloader

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-telegram-downloader.yml'
      - 'tools/telegram-downloader/**'
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/telegram-downloader/requirements.txt pyinstaller

      - name: Build .exe
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name TelegramBatchDownloader `
            --collect-all customtkinter `
            --collect-all telethon `
            --collect-all openpyxl `
            tools/telegram-downloader/telegram_batch_downloader_qr.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramBatchDownloader-windows
          path: dist/TelegramBatchDownloader.exe
          if-no-files-found: error
